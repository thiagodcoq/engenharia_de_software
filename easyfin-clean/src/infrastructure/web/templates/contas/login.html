{% extends 'contas/base_auth.html' %}

{% block content %}
    <h2 class="text-xl font-semibold text-slate-700 mb-6 text-center">Iniciar Sessão</h2>
    <form method="post" action="{{ url_for('contas.login') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Palavra-passe</label>
            <input type="password" name="senha" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Entrar
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-slate-500">
        Não tem conta? <a href="{{ url_for('contas.cadastro') }}" class="text-blue-600 hover:underline font-medium">Registe-se</a>
    </p>
{% endblock %}
