<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8" />
		<title>EasyFin - Autenticação</title>
	</head>
	<body>
		{% with messages = get_flashed_messages() %}
			{% if messages %}
				<ul class="flashes">
				{% for msg in messages %}
					<li>{{ msg }}</li>
				{% endfor %}
				</ul>
			{% endif %}
		{% endwith %}

		{% block content %}{% endblock %}
	</body>
</html>
