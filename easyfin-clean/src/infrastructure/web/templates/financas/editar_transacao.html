<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8" />
		<title>EasyFin - Editar Transação</title>
	</head>
	<body>
		<h1>Editar Transação</h1>

		{% with messages = get_flashed_messages() %}
			{% if messages %}
				<ul style="color: red;">
				{% for msg in messages %}
					<li>{{ msg }}</li>
				{% endfor %}
				</ul>
			{% endif %}
		{% endwith %}

        <form method="post" action="{{ url_for('financas.editar_transacao', transacao_id=transacao.id) }}">
            <label>Valor: <input type="number" step="0.01" name="valor" value="{{ transacao.valor }}" required></label><br>
            
            <label>Tipo:
                <select name="tipo">
                    <option value="SAIDA" {% if transacao.tipo == 'SAIDA' %}selected{% endif %}>SAIDA</option>
                    <option value="ENTRADA" {% if transacao.tipo == 'ENTRADA' %}selected{% endif %}>ENTRADA</option>
                </select>
            </label><br>
            
            <label>Categoria: 
                <select name="categoria" id="categoria_select">
                    <option value="">-- Sem Categoria --</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if transacao.categoria_id == cat.id %}selected{% endif %}>{{ cat.nome }}</option>
                    {% endfor %}
                </select>
            </label><br>
            
            <label>Data: <input type="date" name="data" value="{{ transacao.data.strftime('%Y-%m-%d') }}"></label><br>
            <label>Descrição: <input type="text" name="descricao" value="{{ transacao.descricao }}"></label><br>
            
            <button type="submit">Salvar Alterações</button>
            <a href="{{ url_for('contas.home') }}">Cancelar</a>
        </form>

        <script>
			document.querySelector('form').addEventListener('submit', function(e) {
				const tipo = document.querySelector('select[name="tipo"]').value;
				const categoria = document.querySelector('select[name="categoria"]').value;
				
				if (tipo === 'SAIDA' && !categoria) {
					e.preventDefault();
					alert('A categoria é obrigatória para registrar uma SAIDA.');
				}
			});
		</script>
	</body>
</html>
