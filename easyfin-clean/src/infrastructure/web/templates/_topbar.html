<!-- Cabeçalho padrão das telas internas. Requer `user` no contexto. -->
<header class="topbar">
	<div class="topbar__avatar" aria-hidden="true">{{ user.nome[0] | upper }}</div>
	<div class="topbar__greeting">
		<span class="topbar__hello">Bem-vindo</span>
		<span class="topbar__name">Olá, {{ user.nome }}</span>
	</div>
	<button class="topbar__action" type="button" title="Notificações" aria-label="Notificações">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
			<path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
		</svg>
	</button>
</header>
